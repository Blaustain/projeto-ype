  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Etiquetas SEY - Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./img/Gemini_Generated_Image_58rqsk58rqsk58rq.png">
    <style>
        :root {
            --sap-blue: #005A9E;
            --tag-blue: #2196F3;
            --tag-red: #D32F2F;
            --tag-yellow: #fbc02d; /* Amarelo um pouco mais escuro para leitura */
            --bg-gray: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            background-image: url("./img/ype-logo.avif");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
            color: #333;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            overflow: hidden;
            margin-top: 10px;
        }

        /* Tela de Login */
        #login-screen { padding: 40px 20px; text-align: center; }
        
        /* Cabeçalho do Sistema */
        .header-system { 
            background: #f8f9fa; 
            padding: 15px 20px; 
            border-bottom: 2px solid #ddd; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            gap: 10px;
        }

        /* Abas de Navegação */
        .nav-tabs { display: flex; flex-wrap: wrap; background: #eee; }
        .nav-tabs button { 
            flex: 1; 
            min-width: 120px;
            padding: 15px 5px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 11px; 
            transition: 0.3s;
            text-transform: uppercase;
        }
        
        .btn-azul { border-bottom: 5px solid var(--tag-blue); }
        .btn-amarelo { border-bottom: 5px solid var(--tag-yellow); }
        .btn-vermelho { border-bottom: 5px solid var(--tag-red); }
        
        .nav-tabs button:hover { background: #e0e0e0; }

        /* Formulários */
        .form-section { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .active-form { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 10px; 
            border-bottom: 2px solid #eee; 
        }

        /* Grid Responsivo */
        .grid-fields { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* 2 colunas no desktop */
            gap: 15px; 
        }

        .input-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        .input-group label { font-weight: 600; margin-bottom: 5px; font-size: 14px; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px; /* Evita zoom automático no iPhone */
            box-sizing: border-box;
        }

        .full-width { grid-column: span 2; }

        /* Checkboxes */
        .checkbox-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            background: #fafafa; 
            padding: 15px; 
            border: 1px solid #eee; 
            border-radius: 6px;
        }
        
        .checkbox-group label { 
            display: flex; 
            align-items: center; 
            font-size: 14px; 
            cursor: pointer;
        }
        
        .checkbox-group input { width: auto; margin-right: 10px; }

        .btn-send { 
            background: var(--sap-blue); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 20px;
            font-size: 16px;
            transition: filter 0.2s;
        }
        
        .btn-send:active { filter: brightness(1.2); }

        .hidden { display: none; }

        /* --- MEDIA QUERIES (RESPONSIVIDADE) --- */

        @media (max-width: 600px) {
            body { padding: 10px; }
            
            .header-system { flex-direction: column; text-align: center; }
            
            .nav-tabs button { 
                flex: none; 
                width: 100%; 
                border-bottom: none; 
                border-left: 6px solid #ccc;
                text-align: left;
                padding-left: 20px;
            }

            .btn-azul { border-left-color: var(--tag-blue); }
            .btn-amarelo { border-left-color: var(--tag-yellow); }
            .btn-vermelho { border-left-color: var(--tag-red); }

            .grid-fields { grid-template-columns: 1fr; } /* Força 1 coluna no celular */
            .full-width { grid-column: span 1; }
            
            .checkbox-group { grid-template-columns: 1fr; } /* Checkbox em lista única */
            
            .card-header { flex-direction: column; align-items: flex-start; gap: 5px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color: var(--sap-blue)">Acesso Sistema SEY</h2>
        <div class="input-group">
            <label>Matrícula:</label>
            <input type="number" id="matricula-input" placeholder="Ex: 29577">
        </div>
        <button class="btn-send" onclick="acessarSistema()">Entrar no Sistema</button>
    </div>
